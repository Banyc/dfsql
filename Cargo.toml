[package]
name = "dfsql"
version = "0.15.1"
edition = "2024"
description = "SQL REPL for Data Frames"
license = "MIT"
repository = "https://github.com/Banyc/dfsql"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { version = "1", optional = true }
banyc_polars_util = { version = "0.7", optional = true }
winnow = "1"
clap = { version = "4", features = ["derive"], optional = true }
fancy-regex = { version = "0.14", optional = true }
polars = { version = "0.47", features = [
    "abs",
    "lazy",
    "regex",
    "log",
    "strings",
    "dtype-categorical",
    # https://github.com/pola-rs/polars/issues/22733
    "dtype-i128",
], optional = true }
regex = "1"
rustyline = { version = "15", features = ["derive"], optional = true }
thiserror = "2"

[features]
default = []
dynamic-backend = []
polars-backend = ["dep:polars"]
cli = ["anyhow", "clap", "fancy-regex", "banyc_polars_util", "rustyline", "polars-backend"]

[[bin]]
name = "dfsql"
path = "src/main.rs"
required-features = ["cli"]
